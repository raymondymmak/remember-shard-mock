<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>remember</title>
    <meta
      name="description"
      content="A shard of your own life — you pick the job, the system picks the memory."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,360;0,9..144,500;1,9..144,360;1,9..144,440&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="page">
      <header class="mast">
        <p class="wordmark">remember</p>
        <p class="thesis">You pick the job. The system picks the memory.</p>
      </header>

      <nav class="jobs" aria-label="What do you need">
        <p class="jobs-kicker">What do you need</p>
        <div class="jobs-row" role="tablist" id="jobs"></div>
      </nav>

      <section class="stage" aria-live="polite">
        <article class="shard" id="shard"></article>
        <div class="capture" id="capture">
          <!-- Separate from the library input: capture skips the iOS photo picker. -->
          <input
            id="capture-camera"
            class="sr-only"
            type="file"
            accept="image/*"
            capture="environment"
            tabindex="-1"
          />
          <input
            id="capture-library"
            class="sr-only"
            type="file"
            accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
            tabindex="-1"
          />
          <p class="capture-line">
            <button type="button" class="capture-act" id="capture-take">take a photo</button>
            <button type="button" class="capture-act" id="capture-choose">choose one</button>
          </p>
          <div class="capture-draft" id="capture-draft" hidden>
            <figure class="capture-print">
              <img id="capture-preview" alt="The photo you’re about to keep" />
            </figure>
            <label class="sr-only" for="capture-note">A note for this photo, if you want</label>
            <textarea
              id="capture-note"
              class="capture-note"
              rows="3"
              autocomplete="off"
              autocapitalize="sentences"
              placeholder="A few words from that day, if you want."
            ></textarea>
            <p class="capture-line">
              <button type="button" class="capture-act capture-keep" id="capture-keep">keep this</button>
              <button type="button" class="capture-act" id="capture-discard">let it go</button>
            </p>
          </div>
        </div>
        <div class="bring" id="bring">
          <input
            id="pick-files"
            class="sr-only"
            type="file"
            multiple
            tabindex="-1"
            accept=".jpg,.jpeg,.png,.webp,.md,.txt,.markdown,image/jpeg,image/png,image/webp,text/plain,text/markdown"
          />
          <input
            id="pick-folder"
            class="sr-only"
            type="file"
            multiple
            tabindex="-1"
            webkitdirectory
            directory
          />
          <p class="bring-line">
            <button type="button" class="bring-act" id="bring-files">bring a photo or a note</button>
            <button type="button" class="bring-act" id="bring-folder">or a folder</button>
            <button type="button" class="bring-act" id="samples-toggle" aria-pressed="true">
              samples in
            </button>
          </p>
          <p class="bring-hint" id="bring-hint" role="status">
            Take or choose a photo. Drop files on the page, too — a matching name binds the note.
          </p>
        </div>
        <details class="teach" id="teach">
          <summary>why this ranked</summary>
          <div class="teach-body" id="teach-body"></div>
        </details>
      </section>
    </main>
    <div class="receive" aria-hidden="true"><p>leave them here</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
