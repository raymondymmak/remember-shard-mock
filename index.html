<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>remember</title>
    <meta
      name="description"
      content="A shard of your own life — you pick the job, the system picks the memory."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,360;0,9..144,500;1,9..144,360;1,9..144,440&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="page">
      <header class="mast">
        <p class="wordmark">remember</p>
        <p class="thesis">You pick the job. The system picks the memory.</p>
        <p class="meaning" id="meaning" role="status"></p>
      </header>

      <nav class="jobs" aria-label="What do you need">
        <p class="jobs-kicker">What do you need</p>
        <div class="jobs-row" role="tablist" id="jobs"></div>
      </nav>

      <nav class="folio" id="folio" aria-label="Letters in this pool" hidden>
        <div class="folio-controls">
          <div class="folio-turn">
            <button type="button" class="folio-step lens-seg" id="folio-prev" aria-label="Previous letter">
              prev
            </button>
            <button
              type="button"
              class="folio-all lens"
              id="folio-all"
              aria-expanded="false"
              aria-controls="folio-drawer"
              aria-label="1 of 1, show every shard"
            >
              <span class="folio-place" id="folio-place" aria-live="polite">1 of 1</span>
            </button>
            <button type="button" class="folio-step lens-seg" id="folio-next" aria-label="Next letter">
              next
            </button>
          </div>
        </div>
        <div class="folio-drawer" id="folio-drawer" hidden>
          <p class="folio-kicker">ranked for this job</p>
          <ol class="folio-list" id="folio-list"></ol>
        </div>
      </nav>

      <section class="stage" aria-live="polite">
        <article class="shard" id="shard"></article>
        <div class="intake pool-box" id="capture">
          <p class="pool-invite" id="pool-invite">One of yours, if you want.</p>
          <!-- Separate from the library input: capture skips the iOS photo picker. -->
          <input
            id="capture-camera"
            class="sr-only"
            type="file"
            accept="image/*"
            capture="environment"
            tabindex="-1"
          />
          <input
            id="capture-library"
            class="sr-only"
            type="file"
            accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
            tabindex="-1"
          />
          <input
            id="pick-files"
            class="sr-only"
            type="file"
            multiple
            tabindex="-1"
            accept=".jpg,.jpeg,.png,.webp,.md,.txt,.markdown,.zip,image/jpeg,image/png,image/webp,text/plain,text/markdown,application/zip"
          />
          <input
            id="pick-folder"
            class="sr-only"
            type="file"
            multiple
            tabindex="-1"
            webkitdirectory
            directory
          />
          <p class="intake-line">
            <button type="button" class="intake-act lens-seg" id="capture-take">take a photo</button>
            <button type="button" class="intake-act lens-seg" id="capture-choose">choose one</button>
            <button type="button" class="intake-act lens-seg" id="bring-files" aria-label="Choose photos or notes">
              files
            </button>
            <button type="button" class="intake-act lens-seg" id="bring-folder" aria-label="Choose a folder">
              folder
            </button>
          </p>
          <div class="capture-draft" id="capture-draft" hidden>
            <figure class="capture-print">
              <img id="capture-preview" alt="The photo you’re about to keep" />
            </figure>
            <label class="sr-only" for="capture-note">A note for this photo, if you want</label>
            <textarea
              id="capture-note"
              class="capture-note"
              rows="3"
              autocomplete="off"
              autocapitalize="sentences"
              placeholder="A few words from that day, if you want."
            ></textarea>
            <p class="capture-line">
              <button type="button" class="capture-act capture-keep lens-seg" id="capture-keep">keep this</button>
              <button type="button" class="capture-act lens-seg" id="capture-discard">let it go</button>
            </p>
          </div>
          <p class="samples-line">
            <button type="button" class="samples-act lens" id="samples-toggle" aria-pressed="true">
              samples in
            </button>
          </p>
          <p class="pool-cue" id="pool-cue">Ranking the samples.</p>
          <p class="bring-hint" id="bring-hint" role="status"></p>
        </div>
        <details class="teach" id="teach">
          <summary>why this showed up</summary>
          <div class="teach-body" id="teach-body"></div>
        </details>
      </section>
    </main>
    <div class="receive" aria-hidden="true"><p>leave them here</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
